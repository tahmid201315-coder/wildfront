name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"
  EXPORT_PRESET: "Android Debug"
  APK_PATH: "build/Wildfront-Creature-Survival.apk"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"

jobs:
  build:
    name: Validate, test and export debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL --retry 3 -O "$BASE/SHA512-SUMS.txt"
          curl -fsSL --retry 3 -O "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL --retry 3 -O "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          for f in "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" "Godot_v${GODOT_RELEASE}_export_templates.tpz"; do
            grep " $f\$" SHA512-SUMS.txt > "$f.sha512" || { echo "::error::No checksum entry for $f in SHA512-SUMS.txt"; exit 1; }
            sha512sum -c "$f.sha512" || { echo "::error::Checksum mismatch for $f. Refusing to use it."; exit 1; }
          done
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          ln -s "$PWD/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d tpl
          cp -r tpl/templates/* "$TPL/"
          test -f "$TPL/android_debug.apk" || { echo "::error::android_debug.apk missing from export templates"; exit 1; }
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found at $SDK"; exit 1; fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then echo "::error::sdkmanager not found at $SDKMANAGER"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" "cmdline-tools;latest"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings for Android export
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore_user = "androiddebugkey"
          EOT
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Generate a throwaway debug keystore (never committed)
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/debug.keystore"
          PW="$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          keytool -genkeypair -v -keystore "$KS" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Wildfront Debug,O=Debug,C=US" > /dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Import project (headless)
        run: |
          set -euo pipefail
          mkdir -p logs
          godot --headless --path . --import 2>&1 | tee logs/import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" logs/import.log; then
            echo "::error::GDScript errors found during import. See logs/import.log."
            exit 1
          fi

      - name: Validate project data and run logic tests
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee logs/unit-tests.log
          if ! grep -qE ", 0 failed" logs/unit-tests.log; then echo "::error::Unit tests failed. See logs/unit-tests.log."; exit 1; fi

      - name: Run scripted playthrough test
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/playthrough.gd 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee logs/playthrough.log
          if ! grep -qE ", 0 failed" logs/playthrough.log; then echo "::error::Playthrough test failed. See logs/playthrough.log."; exit 1; fi

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "${EXPORT_PRESET}" "${APK_PATH}" 2>&1 | tee logs/export.log
          if grep -E "Cannot export|configuration errors|Project export for preset .* failed" logs/export.log; then
            echo "::error::Godot reported export errors. See logs/export.log (artifact: build-logs)."
            exit 1
          fi

      - name: Verify the APK exists and is valid
        run: |
          set -euo pipefail
          if [ ! -f "${APK_PATH}" ]; then echo "::error::APK was not created at ${APK_PATH}"; exit 1; fi
          SIZE=$(stat -c %s "${APK_PATH}")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then echo "::error::APK is suspiciously small ($SIZE bytes)"; exit 1; fi
          unzip -tq "${APK_PATH}" > /dev/null || { echo "::error::APK is not a valid zip archive"; exit 1; }
          unzip -l "${APK_PATH}" | grep -q "AndroidManifest.xml" || { echo "::error::AndroidManifest.xml missing from APK"; exit 1; }
          unzip -l "${APK_PATH}" | grep -q "lib/arm64-v8a/" || { echo "::error::arm64-v8a native libraries missing"; exit 1; }
          BT="${ANDROID_SDK}/build-tools/${ANDROID_BUILD_TOOLS}"
          "$BT/aapt" dump badging "${APK_PATH}" | head -5 | tee logs/apk-info.log
          grep -q "package: name='com.wildfront.creaturesurvival'" logs/apk-info.log || { echo "::error::Unexpected package name in APK"; exit 1; }
          "$BT/apksigner" verify "${APK_PATH}" && echo "APK signature verified (debug key)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.4.3
        with:
          name: wildfront-creature-survival-debug-apk-${{ github.run_number }}
          path: build/Wildfront-Creature-Survival.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
